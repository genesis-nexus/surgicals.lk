<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found — Hettiarachchi Surgicals</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    .error-container {
      text-align: center;
      padding: 4rem 1.5rem;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: clamp(5rem, 16vw, 8rem);
      font-weight: 700;
      color: var(--teal-500);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-message { font-size: 1.5rem; margin-bottom: 0.75rem; }
    .error-description {
      color: var(--ink-500);
      margin-bottom: 2rem;
      max-width: 460px;
    }
    .error-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2rem;
    }
    .error-links a {
      font-size: 0.875rem;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--teal-100);
      background: var(--teal-50);
      color: var(--teal-700);
    }
    .error-links a:hover { background: var(--teal-100); }
    .back-home {
      display: inline-block;
      background: var(--teal-500);
      color: var(--white);
      padding: 0.8rem 2rem;
      border-radius: var(--radius-pill);
      font-weight: 600;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .back-home:hover { background: var(--teal-600); color: var(--white); transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-message">Page not found</h1>
    <p class="error-description">
      The page you're looking for doesn't exist or has moved.
      You might find what you need on one of these pages:
    </p>
    <div class="error-links">
      <a href="/wheelchairs-sri-lanka.html">Wheelchairs</a>
      <a href="/hospital-furniture-sri-lanka.html">Hospital furniture</a>
      <a href="/surgical-consumables-sri-lanka.html">Surgical consumables</a>
      <a href="/#products">Full catalog</a>
    </div>
    <a href="/" class="back-home">Back to homepage</a>
  </div>
</body>
</html>
