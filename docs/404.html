<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <script src="/early.js"></script>
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found — Hettiarachchi Surgicals</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    .error-container {
      text-align: center;
      padding: 4rem 1.5rem;
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(6rem, 22vw, 10rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 0.75rem;
      background: linear-gradient(92deg, var(--teal-500), #189A5C);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .error-message { margin-bottom: 0.75rem; }
    .error-description {
      color: var(--ink-500);
      margin-bottom: 2rem;
      max-width: 460px;
    }
    .error-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 2rem;
    }
    .error-links a {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 16px;
      border-radius: var(--radius-pill);
      background: var(--fill);
      color: var(--ink-900);
      font-size: 0.875rem;
      font-weight: 500;
    }
    .error-links a:hover { background: var(--fill-strong); text-decoration: none; }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-message">Page not found</h1>
    <p class="error-description">
      The page you're looking for doesn't exist or has moved.
      You might find what you need on one of these pages:
    </p>
    <div class="error-links">
      <a href="/wheelchairs-sri-lanka.html">Wheelchairs</a>
      <a href="/hospital-furniture-sri-lanka.html">Hospital furniture</a>
      <a href="/surgical-consumables-sri-lanka.html">Surgical consumables</a>
      <a href="/#products">Full catalog</a>
    </div>
    <a href="/" class="btn btn--primary btn--lg back-home">Back to homepage</a>
  </div>
</body>
</html>
