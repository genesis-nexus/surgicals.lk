<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Hettiarachchi Surgicals</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    .error-container {
      text-align: center;
      padding: 4rem 2rem;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .error-code {
      font-size: 8rem;
      font-weight: 800;
      color: #2563eb;
      margin-bottom: 1rem;
      line-height: 1;
    }
    .error-message {
      font-size: 1.5rem;
      color: #374151;
      margin-bottom: 2rem;
    }
    .error-description {
      color: #6b7280;
      margin-bottom: 2rem;
      max-width: 500px;
    }
    .back-home {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .back-home:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-message">Page Not Found</h1>
    <p class="error-description">
      Sorry, the page you are looking for doesn't exist or has been moved. 
      Please check the URL or return to our homepage.
    </p>
    <a href="/" class="back-home">Back to Homepage</a>
  </div>
</body>
</html>
